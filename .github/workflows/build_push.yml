name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - '*'
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build app
        run: ./gradlew assembleRelease -Penable-updater

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release*.apk

      - name: Upload mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release

      # Sign APK and create release for tags

      - name: Get tag name
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'IMSharman/archive'
        env:
          SIGNING_KEY_PRESENT: ${{ secrets.SIGNING_KEY != '' }}
        run: |
          set -x
          echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
          echo "HAS_SIGNING_KEY=${SIGNING_KEY_PRESENT}" >> $GITHUB_ENV

      - name: Sign APK
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'IMSharman/archive' && env.HAS_SIGNING_KEY == 'true'
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Clean up build artifacts
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'IMSharman/archive'
        run: |
          set -e

          pick_apk() {
            local abi="$1"
            if [ -f "app/build/outputs/apk/release/app-${abi}-release-unsigned-signed.apk" ]; then
              echo "app/build/outputs/apk/release/app-${abi}-release-unsigned-signed.apk"
            elif [ -f "app/build/outputs/apk/release/app-${abi}-release-signed.apk" ]; then
              echo "app/build/outputs/apk/release/app-${abi}-release-signed.apk"
            else
              echo "app/build/outputs/apk/release/app-${abi}-release.apk"
            fi
          }

          mv "$(pick_apk universal)" archive-${{ env.VERSION_TAG }}.apk
          sha=$(sha256sum archive-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }')
          echo "APK_UNIVERSAL_SHA=$sha" >> $GITHUB_ENV

          mv "$(pick_apk arm64-v8a)" archive-arm64-v8a-${{ env.VERSION_TAG }}.apk
          sha=$(sha256sum archive-arm64-v8a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }')
          echo "APK_ARM64_V8A_SHA=$sha" >> $GITHUB_ENV

          mv "$(pick_apk armeabi-v7a)" archive-armeabi-v7a-${{ env.VERSION_TAG }}.apk
          sha=$(sha256sum archive-armeabi-v7a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }')
          echo "APK_ARMEABI_V7A_SHA=$sha" >> $GITHUB_ENV

          mv "$(pick_apk x86)" archive-x86-${{ env.VERSION_TAG }}.apk
          sha=$(sha256sum archive-x86-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }')
          echo "APK_X86_SHA=$sha" >> $GITHUB_ENV

          mv "$(pick_apk x86_64)" archive-x86_64-${{ env.VERSION_TAG }}.apk
          sha=$(sha256sum archive-x86_64-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }')
          echo "APK_X86_64_SHA=$sha" >> $GITHUB_ENV

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'IMSharman/archive'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Archive ${{ env.VERSION_TAG }}
          body: |
            ---

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.APK_UNIVERSAL_SHA }} |
            | arm64-v8a | ${{ env.APK_ARM64_V8A_SHA }} |
            | armeabi-v7a | ${{ env.APK_ARMEABI_V7A_SHA }} |
            | x86 | ${{ env.APK_X86_SHA }} |
            | x86_64 | ${{ env.APK_X86_64_SHA }} |
          files: |
            archive-${{ env.VERSION_TAG }}.apk
            archive-arm64-v8a-${{ env.VERSION_TAG }}.apk
            archive-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            archive-x86-${{ env.VERSION_TAG }}.apk
            archive-x86_64-${{ env.VERSION_TAG }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
